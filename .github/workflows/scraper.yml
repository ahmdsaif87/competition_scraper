name: Scraper Lomba Otomatis

on:
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 00:00 WIB
  workflow_dispatch:      

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome for Selenium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable

      - name: Install Playwright browsers
        run: playwright install chromium && playwright install-deps

      - name: Make headless shell symlink (Playwright compat)
        run: |
          PW_DIR=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-* 2>/dev/null || true)
          if [ -z "$PW_DIR" ]; then
            CHROMIUM_DIR=$(ls -d ~/.cache/ms-playwright/chromium-* 2>/dev/null | head -1)
            if [ -n "$CHROMIUM_DIR" ]; then
              VERSION=$(basename "$CHROMIUM_DIR" | sed 's/chromium-//')
              mkdir -p ~/.cache/ms-playwright/chromium_headless_shell-$VERSION/chrome-headless-shell-linux64
              ln -sf "$CHROMIUM_DIR/chrome-linux64/chrome" \
                ~/.cache/ms-playwright/chromium_headless_shell-$VERSION/chrome-headless-shell-linux64/chrome-headless-shell
            fi
          fi
        
      - name: Run scraper to MongoDB
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scraper.py
